  </head><body class="bg-background font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[20px]">school</span></div><span class="font-headline-md text-headline-md text-primary tracking-tight">IMS THAI</span></div><div class="flex items-center gap-2"><button class="w-touch-target h-touch-target flex items-center justify-center relative text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined">notifications</span><span class="absolute top-2.5 right-2.5 w-2 h-2 bg-error rounded-full ring-2 ring-surface"></span></button><button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined">dark_mode</span></button><div class="ml-1 w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-[calc(80px+env(safe-area-inset-bottom))] bg-background"><div class="flex flex-col w-full px-margin-mobile py-6 gap-6 min-h-full bg-surface">
<div class="flex items-center justify-between">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">ยื่นใบลา</h1>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors" onclick="alert('ปิดหน้าต่าง')">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex flex-col gap-4">
<label class="font-label-md text-label-md text-on-surface-variant">ประเภทการลา</label>
<div class="relative flex w-full bg-surface-container rounded-lg p-1" id="leave-type-container">
<div class="absolute top-1 bottom-1 left-1 bg-surface rounded-md shadow-sm transition-transform duration-300 ease-in-out" id="leave-highlight" style="width: calc(33.333% - 0.5rem);"></div>
<button class="flex-1 relative z-10 py-2 text-center font-label-md text-label-md text-primary transition-colors leave-tab active-tab" onclick="selectLeaveType(this, 0, 'sick')">
<span class="flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]">sick</span>
          ลาป่วย
        </span>
</button>
<button class="flex-1 relative z-10 py-2 text-center font-label-md text-label-md text-on-surface-variant transition-colors leave-tab" onclick="selectLeaveType(this, 1, 'personal')">
<span class="flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]">event</span>
          ลากิจ
        </span>
</button>
<button class="flex-1 relative z-10 py-2 text-center font-label-md text-label-md text-on-surface-variant transition-colors leave-tab" onclick="selectLeaveType(this, 2, 'other')">
<span class="flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]">more_horiz</span>
          อื่นๆ
        </span>
</button>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">วันที่ต้องการลา</label>
<div class="bg-primary-container/10 px-3 py-1 rounded-full flex items-center">
<span class="font-label-md text-label-md text-primary" id="day-count-chip">จำนวนวัน: 3 วัน</span>
</div>
</div>
<div class="flex gap-4">
<div class="flex-1 flex flex-col gap-2">
<label class="font-metadata text-metadata text-on-surface-variant">เริ่มต้น</label>
<div class="relative bg-surface-container rounded-xl flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">calendar_today</span>
<input class="bg-transparent border-none outline-none w-full font-body-md text-on-surface appearance-none" id="start-date" onchange="calculateDays()" type="date" value="2024-05-10"/>
</div>
</div>
<div class="flex flex-col justify-center pt-6">
<span class="material-symbols-outlined text-outline">arrow_right_alt</span>
</div>
<div class="flex-1 flex flex-col gap-2">
<label class="font-metadata text-metadata text-on-surface-variant">สิ้นสุด</label>
<div class="relative bg-surface-container rounded-xl flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">calendar_today</span>
<input class="bg-transparent border-none outline-none w-full font-body-md text-on-surface appearance-none" id="end-date" onchange="calculateDays()" type="date" value="2024-05-12"/>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">เหตุผลการลา</label>
<textarea class="bg-surface-container rounded-xl p-4 min-h-[120px] font-body-md text-on-surface resize-none focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow placeholder:text-outline" placeholder="ระบุเหตุผลที่ต้องการลาอย่างละเอียด..."></textarea>
</div>
<div class="bg-status-warning/10 rounded-xl p-4 flex flex-col gap-3 transition-all duration-300 origin-top" id="medical-certificate-warning">
<div class="flex gap-3">
<span class="material-symbols-outlined text-status-warning shrink-0" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-status-warning">ลาป่วยเกิน 3 วัน</span>
<span class="font-body-md text-metadata text-status-warning/80">ระบบกำหนดให้แนบใบรับรองแพทย์สำหรับการลาป่วยติดต่อกัน 3 วันขึ้นไป</span>
</div>
</div>
<label class="flex flex-col items-center justify-center p-6 border-2 border-dashed border-status-warning/30 rounded-lg bg-surface hover:bg-status-warning/5 transition-colors cursor-pointer group" for="file-upload">
<div class="w-12 h-12 rounded-full bg-status-warning/10 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-status-warning">upload_file</span>
</div>
<span class="font-label-md text-label-md text-status-warning">แตะเพื่ออัปโหลดไฟล์</span>
<span class="font-metadata text-metadata text-status-warning/60 mt-1">รองรับ JPG, PNG, PDF (สูงสุด 5MB)</span>
<input accept="image/*,.pdf" class="hidden" id="file-upload" onchange="handleFileUpload(this)" type="file"/>
</label>
<div class="hidden flex items-center justify-between bg-surface p-3 rounded-lg shadow-sm" id="file-preview">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-status-success">check_circle</span>
<span class="font-label-md text-label-md text-on-surface line-clamp-1" id="file-name">certificate.pdf</span>
</div>
<button class="text-error hover:text-error/80 p-1" onclick="removeFile(event)">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
</div>
<div class="mt-auto pt-6 pb-safe">
<button class="w-full h-14 bg-primary rounded-full flex items-center justify-center gap-2 text-on-primary font-headline-md text-label-md shadow-lg shadow-primary/25 hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all" onclick="submitLeave()">
<span class="material-symbols-outlined">send</span>
      ส่งคำขอลา
    </button>
</div>
<script>
    let currentLeaveType = 'sick';

    function selectLeaveType(btn, index, type) {
      currentLeaveType = type;
      const highlight = document.getElementById('leave-highlight');
      highlight.style.transform = `translateX(${index * 100}%)`;
      
      const tabs = document.querySelectorAll('.leave-tab');
      tabs.forEach(tab => {
        tab.classList.remove('text-primary', 'active-tab');
        tab.classList.add('text-on-surface-variant');
      });
      
      btn.classList.add('text-primary', 'active-tab');
      btn.classList.remove('text-on-surface-variant');
      
      checkWarningCondition();
    }

    function calculateDays() {
      const start = new Date(document.getElementById('start-date').value);
      const end = new Date(document.getElementById('end-date').value);
      
      if(start && end && end >= start) {
        const diffTime = Math.abs(end - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        document.getElementById('day-count-chip').textContent = `จำนวนวัน: ${diffDays} วัน`;
        checkWarningCondition(diffDays);
      } else {
        document.getElementById('day-count-chip').textContent = `จำนวนวัน: 0 วัน`;
        checkWarningCondition(0);
      }
    }

    function checkWarningCondition(days) {
      if(days === undefined) {
         const start = new Date(document.getElementById('start-date').value);
         const end = new Date(document.getElementById('end-date').value);
         if(start && end && end >= start) {
           const diffTime = Math.abs(end - start);
           days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
         } else {
           days = 0;
         }
      }

      const warning = document.getElementById('medical-certificate-warning');
      if (currentLeaveType === 'sick' && days >= 3) {
        warning.style.display = 'flex';
        // Trigger reflow for animation
        void warning.offsetWidth;
        warning.style.opacity = '1';
        warning.style.transform = 'scaleY(1)';
      } else {
        warning.style.opacity = '0';
        warning.style.transform = 'scaleY(0.9)';
        setTimeout(() => {
          if (warning.style.opacity === '0') {
             warning.style.display = 'none';
          }
        }, 300);
      }
    }

    function handleFileUpload(input) {
      if (input.files && input.files[0]) {
        const fileName = input.files[0].name;
        document.getElementById('file-name').textContent = fileName;
        document.getElementById('file-preview').classList.remove('hidden');
        document.getElementById('file-preview').classList.add('flex');
        input.parentElement.classList.add('hidden');
      }
    }

    function removeFile(e) {
      e.preventDefault();
      document.getElementById('file-upload').value = '';
      document.getElementById('file-preview').classList.add('hidden');
      document.getElementById('file-preview').classList.remove('flex');
      document.querySelector('label[for="file-upload"]').classList.remove('hidden');
      document.querySelector('label[for="file-upload"]').classList.add('flex');
    }

    function submitLeave() {
      const btn = document.querySelector('button[onclick="submitLeave()"]');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> กำลังส่ง...`;
      btn.classList.add('opacity-80', 'pointer-events-none');
      
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined">check</span> ส่งสำเร็จ!`;
        btn.classList.remove('bg-primary');
        btn.classList.add('bg-status-success');
        
        setTimeout(() => {
          alert('ส่งคำขอลาสำเร็จ');
          // Reset
          btn.innerHTML = originalText;
          btn.classList.add('bg-primary');
          btn.classList.remove('bg-status-success', 'opacity-80', 'pointer-events-none');
        }, 1500);
      }, 1000);
    }

    // Init calculation on load
    calculateDays();
  </script>
</div></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-20 px-2"><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-16 text-on-surface-variant transition-all" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="text-metadata font-label-md">หน้าหลัก</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-16 text-on-surface-variant transition-all" data-path="search" href="#"><span class="material-symbols-outlined">search</span><span class="text-metadata font-label-md">ค้นหา</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-16 text-on-surface-variant transition-all" data-path="attendance" href="#"><span class="material-symbols-outlined">fingerprint</span><span class="text-metadata font-label-md">ลงเวลา</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-16 transition-all text-primary" data-path="logs" href="#"><span class="material-symbols-outlined">description</span><span class="text-metadata font-label-md">บันทึก</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-16 text-on-surface-variant transition-all" data-path="profile" href="#"><span class="material-symbols-outlined">person</span><span class="text-metadata font-label-md">โปรไฟล์</span></a></div></nav></body></html>
