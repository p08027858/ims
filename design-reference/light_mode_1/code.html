<!DOCTYPE html>

<html lang="th"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .blob-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 30% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(96, 99, 238, 0.1) 0%, transparent 40%);
            z-index: -1;
            filter: blur(60px);
            animation: breathe 20s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Password Strength Bar Transitions */
        .strength-bar {
            transition: width 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }

        /* Input floating label styles */
        .floating-input {
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .floating-input:focus {
            border-color: #3525cd;
            box-shadow: 0 0 0 2px rgba(53, 37, 205, 0.1);
        }
        
        /* Shimmer loading for department */
        .shimmer {
            background: linear-gradient(90deg, #f0ecf9 0%, #ffffff 50%, #f0ecf9 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-bg-light min-h-screen flex items-center justify-center p-4 md:p-8 font-body-md text-on-surface relative overflow-x-hidden">
<!-- Soft Animated Background Blob -->
<div class="blob-bg"></div>
<main class="w-full max-w-[500px] z-10">
<div class="glass-card rounded-[24px] p-6 md:p-10 relative overflow-hidden">
<!-- Header Section -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container text-primary mb-4 shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="school" data-weight="fill">school</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary mb-2">สมัครสมาชิกนักศึกษา</h1>
<p class="font-body-md text-on-surface-variant">เริ่มต้นการฝึกงานของคุณได้ในไม่กี่ขั้นตอน!</p>
</div>
<!-- Form -->
<form class="space-y-5" id="registrationForm">
<!-- Student ID & Name Row (Responsive) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="block font-label-md text-on-surface mb-1" for="studentId">รหัสนักศึกษา</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
<input class="w-full h-touch-target pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface placeholder:text-outline/60 focus:outline-none" id="studentId" name="studentId" placeholder="เช่น 640000000" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-on-surface mb-1" for="fullName">ชื่อ-นามสกุล</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-touch-target pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface placeholder:text-outline/60 focus:outline-none" id="fullName" name="fullName" placeholder="ชื่อจริง นามสกุล" required="" type="text"/>
</div>
</div>
</div>
<!-- Faculty & Department -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="block font-label-md text-on-surface mb-1" for="faculty">คณะ</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="account_balance">account_balance</span>
<select class="w-full h-touch-target pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface appearance-none focus:outline-none" id="faculty" name="faculty" onchange="simulateDepartmentLoad()" required="">
<option disabled="" selected="" value="">เลือกคณะ...</option>
<option value="engineering">วิศวกรรมศาสตร์</option>
<option value="science">วิทยาศาสตร์</option>
<option value="business">บริหารธุรกิจ</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-md text-on-surface mb-1" for="department">สาขา</label>
<div class="relative" id="departmentContainer">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline z-10" data-icon="category">category</span>
<!-- Initial state disabled -->
<select class="w-full h-touch-target pl-10 pr-10 bg-surface-variant/30 border border-outline-variant/50 text-on-surface-variant rounded-xl font-body-md appearance-none" disabled="" id="department" name="department">
<option value="">กรุณาเลือกคณะก่อน</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline/50 pointer-events-none z-10" data-icon="expand_more">expand_more</span>
<!-- Loading Overlay (hidden initially) -->
<div class="absolute inset-0 rounded-xl shimmer hidden z-20 border border-outline-variant/30" id="departmentLoader"></div>
</div>
</div>
</div>
<!-- Year & Email -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-5">
<div class="md:col-span-1">
<label class="block font-label-md text-on-surface mb-1" for="year">ชั้นปี</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="format_list_numbered">format_list_numbered</span>
<select class="w-full h-touch-target pl-10 pr-8 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface appearance-none focus:outline-none" id="year" name="year" required="">
<option value="3">ปี 3</option>
<option selected="" value="4">ปี 4</option>
<option value="graduated">จบการศึกษา</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="md:col-span-2">
<label class="block font-label-md text-on-surface mb-1" for="email">อีเมล</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full h-touch-target pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface placeholder:text-outline/60 focus:outline-none" id="email" name="email" placeholder="student@university.ac.th" required="" type="email"/>
</div>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-on-surface mb-1" for="password">รหัสผ่าน</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-touch-target pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface focus:outline-none tracking-widest" id="password" name="password" oninput="checkPasswordStrength()" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('password', 'toggleIcon1')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="toggleIcon1">visibility</span>
</button>
</div>
<!-- Live Password Strength Indicator -->
<div class="mt-2">
<div class="flex justify-between items-center mb-1">
<span class="font-metadata text-outline" id="strengthText">ความปลอดภัยของรหัสผ่าน</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full strength-bar w-0 bg-status-error rounded-full" id="strengthBar"></div>
</div>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-on-surface mb-1" for="confirmPassword">ยืนยันรหัสผ่าน</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock_reset">lock_reset</span>
<input class="w-full h-touch-target pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded-xl floating-input font-body-md text-on-surface focus:outline-none tracking-widest" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start mt-4 pt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 border-outline-variant rounded bg-surface-container-lowest text-primary focus:ring-primary/20 focus:ring-2 cursor-pointer transition-all" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-metadata text-on-surface-variant cursor-pointer" for="terms">
                            ข้าพเจ้ายอมรับ <a class="text-primary font-medium hover:underline" href="#">ข้อตกลงการใช้งาน</a> และ <a class="text-primary font-medium hover:underline" href="#">นโยบายความเป็นส่วนตัว</a>
</label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full h-[52px] bg-gradient-to-r from-primary to-surface-tint text-on-primary rounded-xl font-headline-md shadow-[0_4px_14px_0_rgba(53,37,205,0.39)] hover:shadow-[0_6px_20px_rgba(53,37,205,0.23)] hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-200 relative overflow-hidden group" id="submitBtn" type="submit">
<!-- Button Content -->
<div class="flex items-center justify-center gap-2" id="btnContent">
<span>สมัครสมาชิก</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</div>
<!-- Loading Spinner (Hidden by default) -->
<div class="absolute inset-0 flex items-center justify-center bg-primary hidden" id="btnLoader">
<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
</div>
</button>
</div>
<div class="text-center mt-6">
<p class="font-metadata text-on-surface-variant">
                        มีบัญชีอยู่แล้ว? <a class="text-primary font-medium hover:underline" href="#">เข้าสู่ระบบ</a>
</p>
</div>
</form>
</div>
</main>
<script>
        // Toggle Password Visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Live Password Strength
        function checkPasswordStrength() {
            const pwd = document.getElementById('password').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            let strength = 0;
            if (pwd.length > 0) strength += 1;
            if (pwd.length > 5) strength += 1;
            if (pwd.length > 7 && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) strength += 1;
            
            // Reset classes
            bar.className = 'h-full strength-bar rounded-full';
            
            switch(strength) {
                case 0:
                    bar.style.width = '0%';
                    text.textContent = 'ความปลอดภัยของรหัสผ่าน';
                    break;
                case 1:
                    bar.style.width = '33%';
                    bar.classList.add('bg-status-error');
                    text.textContent = 'อ่อน (ควรเพิ่มความยาว)';
                    text.className = 'font-metadata text-status-error';
                    break;
                case 2:
                    bar.style.width = '66%';
                    bar.classList.add('bg-status-warning');
                    text.textContent = 'ปานกลาง';
                    text.className = 'font-metadata text-status-warning';
                    break;
                case 3:
                    bar.style.width = '100%';
                    bar.classList.add('bg-status-success');
                    text.textContent = 'แข็งแรง';
                    text.className = 'font-metadata text-status-success';
                    break;
            }
        }

        // Simulate Dependent Dropdown Loading
        function simulateDepartmentLoad() {
            const faculty = document.getElementById('faculty').value;
            const deptSelect = document.getElementById('department');
            const loader = document.getElementById('departmentLoader');
            
            if(!faculty) return;

            // Show shimmer loader
            loader.classList.remove('hidden');
            deptSelect.disabled = true;
            deptSelect.innerHTML = '<option value="">กำลังโหลด...</option>';
            
            // Simulate network delay
            setTimeout(() => {
                loader.classList.add('hidden');
                deptSelect.disabled = false;
                deptSelect.classList.remove('bg-surface-variant/30', 'text-on-surface-variant');
                deptSelect.classList.add('bg-surface-container-lowest', 'floating-input', 'text-on-surface');
                
                // Populate fake data based on faculty
                let options = '<option value="" disabled selected>เลือกสาขา...</option>';
                if(faculty === 'engineering') {
                    options += '<option value="ce">วิศวกรรมคอมพิวเตอร์</option><option value="ee">วิศวกรรมไฟฟ้า</option>';
                } else if(faculty === 'science') {
                    options += '<option value="cs">วิทยาการคอมพิวเตอร์</option><option value="it">เทคโนโลยีสารสนเทศ</option>';
                } else {
                    options += '<option value="mkt">การตลาด</option><option value="fin">การเงิน</option>';
                }
                
                deptSelect.innerHTML = options;
            }, 800);
        }

        // Form Submit Animation
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate pass match (simple example)
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if(pwd !== confirm) {
                // Shake animation class would go here
                document.getElementById('confirmPassword').classList.add('border-status-error');
                setTimeout(() => document.getElementById('confirmPassword').classList.remove('border-status-error'), 2000);
                return;
            }

            const btnContent = document.getElementById('btnContent');
            const btnLoader = document.getElementById('btnLoader');
            
            // Loading state
            btnContent.classList.add('opacity-0');
            btnLoader.classList.remove('hidden');
            
            // Simulate API call
            setTimeout(() => {
                // Reset (or redirect in real app)
                btnContent.classList.remove('opacity-0');
                btnLoader.classList.add('hidden');
                
                // Success visual cue (optional celebration)
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.classList.remove('from-primary', 'to-surface-tint');
                submitBtn.classList.add('bg-status-success');
                btnContent.innerHTML = '<span>สำเร็จ!</span><span class="material-symbols-outlined">check_circle</span>';
                
                setTimeout(() => {
                    // Reset to normal
                    submitBtn.classList.add('from-primary', 'to-surface-tint');
                    submitBtn.classList.remove('bg-status-success');
                    btnContent.innerHTML = '<span>สมัครสมาชิก</span><span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>';
                }, 2000);
                
            }, 1500);
        });
    </script>
</body></html>
