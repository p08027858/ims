<script>
        // Simple script to handle password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button:has(span[data-icon="visibility"])');
            const passwordInput = document.getElementById('password');
            const iconSpan = toggleBtn.querySelector('span');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    iconSpan.textContent = 'visibility_off';
                    iconSpan.setAttribute('data-icon', 'visibility_off');
                } else {
                    passwordInput.type = 'password';
                    iconSpan.textContent = 'visibility';
                    iconSpan.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>
